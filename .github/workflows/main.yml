name: Scrape & Export Berita

on:
  workflow_dispatch:          # Tombol manual di tab Actions
  schedule:
    - cron: '0 */6 * * *'     # Opsional: jalankan otomatis tiap 6 jam

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 45         # Waktu ditambah jadi 45 menit (antisipasi jika scrape dan buat ribuan file)

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser requests beautifulsoup4 lxml

      # ===== JALANKAN FILE GABUNGAN ANDA =====
      # Pastikan nama file di bawah ini sesuai dengan yang Anda simpan di GitHub
      - name: Jalankan Scraper & Export
        run: python importexport.py

      # ===== COMMIT & PUSH KE REPO =====
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ambil semua file HTML, XML, TXT, dan folder database
          git add *.html *.xml *.txt database_hasil5/ || true
          
          # Cek apakah ada perubahan. Jika tidak ada artikel baru, hentikan dengan sukses.
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          
          # Commit dan Push
          git commit -m "Update otomatis: Scrape & Export HTML [skip ci]"
          git pull --rebase origin main || true
          git push
